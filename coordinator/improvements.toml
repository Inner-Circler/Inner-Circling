# coordinator/improvements.toml — suggested improvements to the mid-term
# derivation prompt, moved out of coordinator/midterms_project.py
# 2026-08-09 (was a hardcoded IMPROVEMENTS list — see sanitize.py's
# embedded-data check, which is what flagged it).
#
# Each entry is a change to the prompt, with the evidence that prompted
# it.
#   LANDED    in `mid_term.SYSTEM` now.
#   DENIED    Self ruled it out, and the reason is recorded because a
#             rejected proposal whose reasoning is lost gets re-proposed.
#   DEFERRED  real, unmeasured, and waiting.

register = "improvements"

[[improvement]]
status = "LANDED"
title = "exclude what the shared block already says"
why = """The honesty mandate and each part's named watch are in `process_core.md`, which reaches every part in `circle_identity`. Five of the seven first-run distillates restated it anyway — seven copies of one sentence, in the block whose whole purpose is to stop that. Self caught it: *"Is the honesty watch per-part? I think there is already a circle practice? I do not need repeat commitments per part."*"""

[[improvement]]
status = "LANDED"
title = "prefer the part's own words; coin nothing"
why = """Many lines are already the part's own formulations — *a wall does not judge what leans against it* is the Judge's sentence. A distillate that reworded them would put my voice where its identity is, which is the objection Self raised at R101 one level down."""

[[improvement]]
status = "LANDED"
title = "give it nothing it does not have"
why = """The distillate must not hand a part a test it never articulated. Without this the derivation drifts toward writing a good part rather than reporting the one on the record."""

[[improvement]]
status = "LANDED"
title = "a very short result is a LOSS, not economy"
why = """Only a maximum was stated. A cap alone rewards dropping material, and nothing would have reported a distillate that came back at 800 characters as suspicious."""

[[improvement]]
status = "LANDED"
title = "live-edge section only if the record has one open"
why = """The Judge has the father-grief gap. A section that must always be filled invites invention in the six parts that do not."""

[[improvement]]
status = "DENIED"
title = "require every claim to be TRACEABLE, and check a sample"
why = """I proposed that the derivation return one distinctive source phrase per heading, located with `asks_extract.locate`, failing the run if any could not be found. Self denied it 2026-08-07: *"The checkable claim would verify the presence of origins that large themselves carry the authority of an LLM derivation at circle time. The entire system is placing substantial trust in LLM derivations."* He is right, and the distinction is where a guard can be anchored at all: an ask fragment's backing quote sits in a part's STATEMENT — an event that happened in a room, recorded as said — which anchors outside the derivation. A mid_term's sources are `long_term.md` and `## Dreamt` sections, which are themselves derivations. Locating a phrase in one proves two derivations agree, not that either is true. **A guard that checks derivation against derivation is theatre with a passing exit code.**"""

[[improvement]]
status = "LANDED"
title = "open from the IDENTITY CORE, not from the dreams"
why = """Approved 2026-08-07. What a part fundamentally is comes from the sections of `long_term.md` above `## Dream entries` — the material no nightly authored. Without this the most recent circle recolours what the part is, rather than sharpening or extending it."""

[[improvement]]
status = "DEFERRED"
title = "cap how much of the distillate may come from ONE circle"
why = """*"Cap: not now."* — Self, 2026-08-07. The two most recent `## Dreamt` sections are the freshest and most vivid sources and nothing stops them dominating a record spanning fifty circles. It remains a suspicion rather than a finding, and would need measuring before it is worth a rule."""
