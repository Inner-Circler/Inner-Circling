preamble = """

BEST PRACTICES -- how the CIRCLE behaves and, merged in since R133, how you move. Routing is by the `addressee` field alone (R134); coordinator/practice_manager.py selects the rows (practice_broadcast() for BLOCK 1, practice_narrowcast() for the addressed part's BLOCK 3), and is the one reader and writer of this file.

**Entries: 0** -- a TALLY, never a cap.

SHIPPED EMPTY, and empty is correct: a circle that has ruled nothing in has no practices. Entries arrive as you rule them. `next_id = 1` and an empty table are exactly what the register's own reader builds when the file is absent."""
