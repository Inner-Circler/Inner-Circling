The PROPOSAL COALESCE register (R356, B69): before each circle's vetting queue is shown, one model pass groups pending proposals that are the same ask in different words -- across circles, across authors, across the propose and practice registers -- so Self rules on one strengthened ask instead of clearing near-duplicates by hand. coordinator/proposal_group_manager.py is the one reader and writer.

SHIPPED EMPTY. `next_id` at 1, an empty `group` table and blank `hash`/`derived`/`note` are exactly what coordinator/proposal_group_manager.py builds when this file is absent, so a fresh install reads the same REGISTER either way. This `[doc]` table is the one deliberate difference: `_load()`'s absent-file document carries no `doc` key at all, and this preamble is a superset of it on purpose. In the project's own tree, coordinator/tests/test_scaffold_delegates.py declares that tolerance by name and FAILS on any other divergence, so the difference is asserted every commit rather than overlooked; the suites do not ship, so nothing in this copy re-checks it. Said here because two separate readings have now reported it as drift. The model only suggests a grouping; accepting one still enacts each member through that member's own existing approve path in its own register -- this file never holds a proposal or a practice, only the grouping and why."""
