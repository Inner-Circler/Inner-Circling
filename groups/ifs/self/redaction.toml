register = "redaction"
next_person = 1
next_place = 1
next_org = 1
next_other = 1
alias = []

[doc]
preamble = """
The operator's own curated redaction targets -- names, places, orgs to hide in ui/circling.py's redacted CIRCLE-pane view: added, updated and removed one at a time, each under a stable, reversible opaque id. Part names are never eligible -- redaction_manager.py refuses one at add/update time and filters it out of the compiled pattern besides.

SHIPPED EMPTY; targets are added one at a time with /redact-alias-add. `next_person`/`next_place`/`next_org`/`next_other` all at 1 and an empty table are exactly what coordinator/redaction_manager.py builds when the file is absent, so a fresh install reads the same document either way. The file exists so it is there, valid and loadable, rather than conjured on first write.

groups/ifs/self/redaction_map.toml -- the reverse map for auto-detected structured identifiers (email/url/phone/handle), a SEPARATE file -- never ships at all, empty or otherwise: its `literal` field IS the raw PII a redacted view exists to hide. It appears the first time the view hides one; keep it as private as your transcripts."""
