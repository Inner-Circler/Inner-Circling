register = "topics"
next_id = 1
topic = []

[doc]
preamble = """

SYNTHESIS's unvetted BLOCK 2 topics: unvetted synthesis output reaches BLOCK 2 so the circle itself can review it. TP- ids, 800 characters each, a 2,400-character newest-first window, open until Self closes one. Direct write, never vetted -- BLOCK 1 still takes vetted content only. Closed rows are tombstones, never deleted.

SHIPPED EMPTY; topics arrive as SYNTHESIS writes them. `next_id = 1` and an empty table are exactly what coordinator/topic_manager.py builds when the file is absent, so a fresh install reads the same document either way. The file exists so it is there, valid and loadable, rather than conjured on first write."""
